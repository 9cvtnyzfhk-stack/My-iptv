
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My IPTV</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080d18;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 background:#111d32;
 padding:20px 4%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:2px solid #087fbd;
}

.logo{
 font-size:30px;
 font-weight:bold;
 color:#20baff;
}

main{padding:22px 4%}

input,button{
 padding:14px;
 border-radius:7px;
 font-size:17px;
}

input{
 background:#19263a;
 color:white;
 border:1px solid #45546c;
 width:100%;
 margin:6px 0;
}

button{
 background:#087fbd;
 color:white;
 border:0;
 cursor:pointer;
 margin:5px;
}

button:focus,input:focus{
 outline:3px solid #42c9ff;
}

.tabs{margin:12px 0}

.tabs button{min-width:130px}

.active{background:#07558d}

.panel{
 background:#142139;
 padding:16px;
 border-radius:12px;
 margin:12px 0;
}

.hidden{display:none!important}

.layout{
 display:grid;
 grid-template-columns:1fr 1.2fr;
 gap:18px;
}

video{
 width:100%;
 background:black;
 aspect-ratio:16/9;
 border-radius:10px;
}

#channels{
 max-height:500px;
 overflow-y:auto;
}

.channel{
 display:flex;
 align-items:center;
 width:100%;
 text-align:right;
 background:#1d2c45;
 margin:5px 0;
}

.channel img{
 width:42px;
 height:42px;
 object-fit:contain;
 margin-left:12px;
}

.channel span{flex:1}

#status{
 color:#55caff;
 padding:10px;
}

@media(max-width:700px){
 .layout{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <div class="logo">MY IPTV</div>
 <div>مشغل التلفزيون الذكي</div>
</header>

<main>

<h2>مشاهدة القنوات المباشرة</h2>

<div class="panel">
 <div class="tabs">
  <button id="m3ubtn" class="active"
   onclick="showTab('m3u')">M3U</button>

  <button id="xtbtn"
   onclick="showTab('xt')">Xtream Codes</button>
 </div>

 <section id="m3u">
  <input id="m3ulink" type="url"
   placeholder="رابط قائمة M3U">

  <button onclick="loadM3U()">تحميل القائمة</button>
 </section>

 <section id="xt" class="hidden">
  <input id="server" placeholder="رابط السيرفر">
  <input id="username" placeholder="اسم المستخدم">
  <input id="password" type="password"
   placeholder="كلمة المرور">

  <button onclick="loadXtream()">اتصال</button>
 </section>

 <div id="status">أدخل بيانات اشتراكك للبدء</div>
</div>

<div class="layout">

 <section class="panel">
  <h3>مشغل My IPTV</h3>

  <video id="video"
   controls
   playsinline
   preload="none">
  </video>

  <h3 id="playing">لم يتم اختيار قناة</h3>
 </section>

 <section class="panel">
  <h3>قائمة القنوات</h3>
  <div id="channels">لا توجد قنوات محملة</div>
 </section>

</div>

</main>

<script src="player.js"></script>

<script>
const statusBox=document.getElementById("status");
const channelsBox=document.getElementById("channels");
const video=document.getElementById("video");

function showTab(tab){
 document.getElementById("m3u").classList.toggle("hidden",tab!=="m3u");
 document.getElementById("xt").classList.toggle("hidden",tab!=="xt");

 document.getElementById("m3ubtn").classList.toggle("active",tab==="m3u");
 document.getElementById("xtbtn").classList.toggle("active",tab==="xt");
}

function setStatus(message){
 statusBox.textContent=message;
}

function displayChannels(channels){
 channelsBox.replaceChildren();

 channels.forEach((channel,index)=>{
  const button=document.createElement("button");
  button.className="channel";

  if(channel.logo){
   const img=document.createElement("img");
   img.src=channel.logo;
   img.alt="";
   button.appendChild(img);
  }

  const name=document.createElement("span");
  name.textContent=channel.name;
  button.appendChild(name);

  button.onclick=()=>playChannel(index);
  channelsBox.appendChild(button);
 });

 setStatus("تم تحميل "+channels.length+" قناة");
}

async function loadM3U(){
 const url=document.getElementById("m3ulink").value.trim();

 if(!url){
  setStatus("أدخل رابط القائمة أولاً");
  return;
 }

 try{
  setStatus("جاري تحميل القنوات...");
  const channels=await MyIPTV.loadM3U(url);
  displayChannels(channels);
 }catch(error){
  setStatus("تعذر التحميل: "+error.message);
 }
}

async function loadXtream(){
 const server=document.getElementById("server").value.trim();
 const username=document.getElementById("username").value.trim();
 const password=document.getElementById("password").value;

 if(!server||!username||!password){
  setStatus("أكمل بيانات الاشتراك");
  return;
 }

 try{
  setStatus("جاري الاتصال بالسيرفر...");
  const channels=await MyIPTV.loadXtream(server,username,password);
  displayChannels(channels);
 }catch(error){
  setStatus("فشل الاتصال: "+error.message);
 }
}

function playChannel(index){
 try{
  const channel=MyIPTV.getChannels()[index];
  if(!channel)return;

  video.src=channel.url;
  document.getElementById("playing").textContent=channel.name;

  const result=video.play();
  if(result){
   result.catch(()=>{
    setStatus("تعذر التشغيل. تحقق من صيغة البث والاتصال.");
   });
  }

  setStatus("جاري تشغيل: "+channel.name);

 }catch(error){
  setStatus("خطأ في تشغيل القناة");
 }
}

video.addEventListener("error",()=>{
 setStatus("تعذر تشغيل القناة. قد تكون صيغة البث أو الترميز غير مدعوم.");
});
</script>

</body>
</html>
